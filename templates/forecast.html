<!DOCTYPE html>
<html>
    <head>
        <title>Forecast Results</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <div class="container">
            <h1>Forecast Results</h1>

            <a href="/">Back</a>

            <div class="forecast">
                {% for period in forecast[:5] %}
                    <div class="forecast-item">
                        <div class="period-name">{{ period.name }}</div>
                        <div class="temp">{{ period.temperature }}°</div>
                        <div class="description">{{ period.forecast }}</div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </body> 
</html>
